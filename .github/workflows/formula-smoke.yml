# Installs zfb from the formula in this checkout and asserts the binary
# actually reports the version the formula claims.
#
# Why this exists: the release workflow in Takazudo/zudo-front-builder asserts
# `zfb -V` inside its per-platform build matrix. When the macOS x86_64
# archive is pre-built locally and uploaded to the Release ahead of time, that
# matrix entry is dropped — so the x86_64-apple-darwin binary is the one
# platform whose version stamp nothing verifies. The macos-15-intel leg below closes
# that gap.
#
# It also covers what no test upstream can: the formula itself. A wrong sha256,
# a dead Release URL, or an archive whose layout breaks `bin.install "zfb"`
# would all reach users silently, because the formula is generated by a script
# and pushed straight to main without review.

name: Formula smoke

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      # Self-test: changes to this workflow exercise it too.
      - ".github/workflows/formula-smoke.yml"
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 05:23 UTC. Catches a Release asset that disappears or a
    # checksum that drifts long after the formula was written.
    - cron: "23 5 * * 0"

permissions:
  contents: read

concurrency:
  group: formula-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's result is wanted — one bad checksum should not mask
      # the others.
      fail-fast: false
      matrix:
        # macos-15-intel, not macos-13: the macOS 13 image was retired
        # 2025-12-04, so a job asking for it now queues forever instead of
        # failing. macos-15-intel is the last x86_64 macOS image Actions will
        # offer — it goes away in Fall 2027, taking Intel CI coverage with it.
        os: [macos-latest, macos-15-intel, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Put brew on PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi

      # Homebrew refuses `brew install ./Formula/zfb.rb` outright — "Homebrew
      # requires formulae to be in a tap". So point a real tap at this
      # checkout: that installs the code under test rather than whatever is
      # currently published, which keeps this honest if the repo ever grows a
      # pull-request flow.
      - name: Tap this checkout
        run: |
          set -euo pipefail
          brew tap takazudo/tap "$GITHUB_WORKSPACE"
          brew tap

      - name: Install zfb from the tap
        run: brew install takazudo/tap/zfb

      - name: Run the formula's own test block
        run: brew test takazudo/tap/zfb

      - name: Assert -V matches the formula
        run: |
          set -euo pipefail
          expected_version="$(sed -n -E 's/^[[:space:]]*version "([^"]+)".*/\1/p' Formula/zfb.rb | head -1)"
          if [ -z "$expected_version" ]; then
            echo "::error::could not parse a version from Formula/zfb.rb"
            exit 1
          fi

          expected="zfb ${expected_version}"
          actual="$(zfb -V)"
          echo "Expected: ${expected}"
          echo "Actual:   ${actual}"

          if [ "${actual}" != "${expected}" ]; then
            echo "::error::-V mismatch on ${{ matrix.os }}: got '${actual}', want '${expected}'"
            exit 1
          fi
